name: Benchmark

on:
  workflow_dispatch:

concurrency:
  group: load-bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evil_engine
          POSTGRES_PASSWORD: evil_engine
          POSTGRES_DB: evil_engine_test
        ports:
          - 5543:5432
        options: >-
          --health-cmd="pg_isready -U evil_engine"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.20"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3-otp-29"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - run: mix deps.get && mix deps.compile.sat && mix deps.compile && mix compile --warnings-as-errors

      - run: mix do --app peripheral_persistence ecto.create --quiet && mix ecto.migrate

      - run: mix test.load

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-bench-report
          path: test/load/reports/*.json
          if-no-files-found: error
