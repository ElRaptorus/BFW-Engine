name: SDK & Client Packages CI

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  lint-build-unit:
    name: Lint + Build + Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/js
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node v26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true

      - name: Install pnpm
        run: npm install -g pnpm@12.4.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @elraptorus/bfw_engine_sdk --filter @elraptorus/bfw_engine_client run lint

      - name: Build
        run: pnpm --filter @elraptorus/bfw_engine_sdk --filter @elraptorus/bfw_engine_client run build

      - name: Unit tests
        run: pnpm --filter @elraptorus/bfw_engine_sdk --filter @elraptorus/bfw_engine_client run test:unit

  integration:
    name: Integration Tests
    needs: lint-build-unit
    runs-on: ubuntu-latest
    env:
      MIX_ENV: prod
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bfw_engine
          POSTGRES_PASSWORD: bfw_engine
          POSTGRES_DB: bfw_engine_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bfw_engine"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7

      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev

      - name: Install Erlang / Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3-otp-29"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Setup Node v26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true

      - name: Install pnpm
        run: npm install -g pnpm@12.4.2

      - name: Cache Mix deps and _build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-prod-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-prod-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Compile engine and build release
        run: |
          mix deps.get --only prod
          mix deps.compile.sat
          mix deps.compile
          # The Mix cache is keyed on mix.lock only (no app source hashes). A
          # restored `_build` can look fresh to Mix after checkout, so `mix
          # compile` may skip api_web and ship a stale GraphQL schema into the
          # release. Client integration then queries fields that exist in this
          # commit's source but not in the cached BEAMs.
          mix compile --force
          mix release
        timeout-minutes: 15

      - name: Start engine
        env:
          BFE_DATABASE_HOST: localhost
          BFE_DATABASE_PORT: "5432"
          BFE_DATABASE_NAME: bfw_engine_dev
          BFE_DATABASE_USER: bfw_engine
          BFE_DATABASE_PASS: bfw_engine
          # Production defaults are 100 write + 50 read. GitHub Actions
          # service containers cannot override Postgres' max_connections
          # (100), so size the pools down for this job.
          BFE_DB_POOL_SIZE: "10"
          BFE_DB_READ_POOL_SIZE: "5"
          BFE_HTTP_PORT: "4100"
          BFE_HTTP_SECRET_KEY_BASE: "AveOmnissiah_FromTheHolyForgesOfMars_NotAProductionSecret_Mechanicus!!"
          BFE_ENGINE_ID: "bfw-engine-ci-integration"
          BFE_ENGINE_NAME: "BFW-Engine (CI Integration)"
          BFE_TOKEN_MAX_BYTES: "65536"
          BFE_JWT_HS256_SECRET: "AveOmnissiah_FromTheHolyForgesOfMars_NotAProductionSecret_Mechanicus!!"
          BFE_EVENT_SINK_CONSOLE: "on"
          BFE_EVENT_SINK_TELEMETRY: "on"
          BFE_EVENT_SINK_WEBSOCKET: "on"
        run: |
          _build/prod/rel/bfw_engine/bin/bfw_engine eval "BfwEngine.Persistence.Release.migrate()"
          _build/prod/rel/bfw_engine/bin/bfw_engine eval "BfwEngine.Persistence.Release.ensure_partitions()"
          _build/prod/rel/bfw_engine/bin/bfw_engine daemon

      - name: Wait for engine health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4100/health; then
              echo "Engine is healthy"
              exit 0
            fi
            echo "Waiting for engine... attempt $i/60"
            sleep 2
          done
          echo "Engine did not become healthy in time"
          exit 1

      - name: Install JS dependencies
        working-directory: packages/js
        run: pnpm install --frozen-lockfile

      - name: Build JS packages
        working-directory: packages/js
        run: pnpm --filter @elraptorus/bfw_engine_sdk --filter @elraptorus/bfw_engine_client run build

      - name: Run integration tests
        working-directory: packages/js
        env:
          ENGINE_HTTP_URL: http://localhost:4100
          ENGINE_WS_URL: ws://localhost:4100/socket
        run: pnpm --filter @elraptorus/bfw_engine_client run test:integration

      - name: Stop engine
        if: always()
        run: _build/prod/rel/bfw_engine/bin/bfw_engine stop 2>/dev/null || true

  publish:
    name: Publish to GitHub Packages
    needs: integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/js
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node v26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true
          registry-url: https://npm.pkg.github.com
          scope: "@elraptorus"

      - name: Install pnpm
        run: npm install -g pnpm@12.4.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @elraptorus/bfw_engine_sdk --filter @elraptorus/bfw_engine_client run build

      - name: Version from release tag
        id: version-release
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "Using release tag: $TAG → version $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Version from registry (auto-increment)
        id: version-dispatch
        if: github.event_name != 'release'
        run: |
          set -euo pipefail
          PACKAGE_NAME="@elraptorus/bfw_engine_sdk"

          echo "Querying registry for latest published version of $PACKAGE_NAME..."

          set +e
          QUERY_OUTPUT=$(pnpm view "$PACKAGE_NAME" version --registry https://npm.pkg.github.com 2>&1)
          QUERY_EXIT=$?
          set -e

          if [ $QUERY_EXIT -eq 0 ] && [ -n "$QUERY_OUTPUT" ]; then
            LATEST=$(echo "$QUERY_OUTPUT" | tr -d '[:space:]')
            echo "Latest published version: $LATEST"
            NEXT_VERSION=$(node -e "const [M,m,p]='${LATEST}'.split('.').map(Number); console.log(M+'.'+m+'.'+(p+1))")
          elif echo "$QUERY_OUTPUT" | grep -qi "404\|not found\|E404"; then
            echo "Package not yet published — starting at 0.1.0"
            NEXT_VERSION="0.1.0"
          else
            echo "::error::Failed to query registry for $PACKAGE_NAME (exit $QUERY_EXIT): $QUERY_OUTPUT"
            exit 1
          fi

          echo "Resolved publish version: $NEXT_VERSION"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish SDK
        working-directory: packages/js/sdk
        run: |
          set -euo pipefail
          VERSION="${{ steps.version-release.outputs.version || steps.version-dispatch.outputs.version }}"
          LOCAL_VERSION=$(node -p "require('./package.json').version")

          if [ "$VERSION" != "$LOCAL_VERSION" ]; then
            echo "Bumping SDK version: $LOCAL_VERSION → $VERSION"
            pnpm version "$VERSION" --no-git-tag-version
          fi

          echo "Publishing @elraptorus/bfw_engine_sdk@$VERSION"
          pnpm publish --no-git-checks --access restricted

      - name: Publish Client
        working-directory: packages/js/client
        run: |
          set -euo pipefail
          VERSION="${{ steps.version-release.outputs.version || steps.version-dispatch.outputs.version }}"
          LOCAL_VERSION=$(node -p "require('./package.json').version")

          if [ "$VERSION" != "$LOCAL_VERSION" ]; then
            echo "Bumping Client version: $LOCAL_VERSION → $VERSION"
            pnpm version "$VERSION" --no-git-tag-version
          fi

          echo "Publishing @elraptorus/bfw_engine_client@$VERSION"
          pnpm publish --no-git-checks --access restricted

      - name: Summary
        env:
          VERSION: ${{ steps.version-release.outputs.version || steps.version-dispatch.outputs.version }}
        run: |
          echo "### Published Packages" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | Version |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`@elraptorus/bfw_engine_sdk\` | \`$VERSION\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`@elraptorus/bfw_engine_client\` | \`$VERSION\` |" >> "$GITHUB_STEP_SUMMARY"
