name: Engine CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and Test Application
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evil_engine
          POSTGRES_PASSWORD: evil_engine
          POSTGRES_DB: evil_engine_test
        ports:
          - 5543:5432
        options: >-
          --health-cmd="pg_isready -U evil_engine"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Install Erlang / Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3-otp-29"

      - name: Restore Dialyzer PLT
        id: plt_cache
        uses: actions/cache/restore@v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install Dependencies
        run: mix deps.get

      - name: Dependency security audit
        run: mix deps.audit

      - name: Compile Dependencies
        run: mix deps.compile

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Extension manifest up to date
        run: mix evil.gen.extension_manifest --check

      - name: Format check
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Dialyzer
        run: mix dialyzer --format github

      - name: Save Dialyzer PLT
        if: always() && steps.plt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}

      - name: Sobelow (web security scan)
        run: mix sobelow

      - name: Wait for Postgres
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends postgresql-client
          for i in {1..30}; do
            if pg_isready -h localhost -p 5543 -U evil_engine; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres never became ready"
          exit 1

      - name: Create and migrate test database
        run: |
          mix do --app peripheral_persistence ecto.create
          mix do --app peripheral_persistence ecto.migrate

      - name: Run tests with coverage
        timeout-minutes: 45
        run: |
          mix test.coverdata
          mix coveralls --umbrella --import-cover cover

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t engine:ci .

      - name: Start Postgres
        run: |
          docker network create ci-net

          # Production pools are 100 write + 50 read; stock Postgres allows 100.
          docker run -d \
            --name postgres \
            --network ci-net \
            -e POSTGRES_USER=evil_engine \
            -e POSTGRES_PASSWORD=evil_engine \
            -e POSTGRES_DB=evil_engine_ci \
            postgres:16-alpine \
            postgres -c max_connections=200

          ready=0
          for i in $(seq 1 15); do
            if docker exec postgres pg_isready -U evil_engine > /dev/null 2>&1; then
              echo "Postgres ready"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "Postgres never became ready"
            docker logs postgres
            exit 1
          fi

      - name: Start application container
        run: |
          docker run -d \
            --name engine \
            --network ci-net \
            -p 4000:4000 \
            -e TDE_DATABASE_HOST=postgres \
            -e TDE_DATABASE_PORT=5432 \
            -e TDE_DATABASE_NAME=evil_engine_ci \
            -e TDE_DATABASE_USER=evil_engine \
            -e TDE_DATABASE_PASS=evil_engine \
            -e TDE_HTTP_PORT=4000 \
            -e TDE_HTTP_SECRET_KEY_BASE=ci-only-secret-key-base-must-be-at-least-64-characters-long-for-phoenix \
            -e TDE_AUTH_DISABLED=true \
            -e TDE_ENGINE_ID=evil-engine-ci \
            -e TDE_ENGINE_NAME="Daemon Engine (CI)" \
            engine:ci

      - name: Verify health endpoint
        run: |
          # GET /health is 204 No Content (empty body). Do not grep JSON.
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:4000/health || true)
            if [ "$code" = "204" ]; then
              echo "Health check passed (HTTP 204)"
              echo "Docker smoke test passed"
              exit 0
            fi
            echo "Waiting... ($i/30) HTTP ${code:-curl-failed}"
            sleep 2
          done

          echo "Docker smoke test FAILED — expected HTTP 204 from GET /health"
          echo "=== container logs ==="
          docker logs engine
          exit 1

      - name: Tear down
        if: always()
        run: |
          docker rm -f engine postgres 2>/dev/null || true
          docker network rm ci-net 2>/dev/null || true
