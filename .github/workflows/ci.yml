name: Engine CI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish Docker image?"
        type: boolean
        default: false
  # push:
  #   branches:
  #     - main
  #     - develop
  # pull_request:
  #   branches:
  #     - main
  #     - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and Test Application
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evil_engine
          POSTGRES_PASSWORD: evil_engine
          POSTGRES_DB: evil_engine_test
        ports:
          - 5543:5432
        options: >-
          --health-cmd="pg_isready -U evil_engine"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true

      - name: Install Erlang / Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3-otp-29"

      - name: Restore Dialyzer PLT
        id: plt_cache
        uses: actions/cache/restore@v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install Dependencies
        run: mix deps.get

      - name: Dependency security audit
        run: mix deps.audit

      - name: Compile Dependencies
        run: mix deps.compile

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Extension manifest up to date
        run: mix evil.gen.extension_manifest --check

      - name: Format check
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Dialyzer
        run: mix dialyzer --format github

      - name: Save Dialyzer PLT
        if: always() && steps.plt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}

      - name: Sobelow (web security scan)
        run: mix sobelow

      - name: Wait for Postgres
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends postgresql-client
          for i in {1..30}; do
            if pg_isready -h localhost -p 5543 -U evil_engine; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres never became ready"
          exit 1

      - name: Create and migrate test database
        run: |
          mix do --app peripheral_persistence ecto.create
          mix do --app peripheral_persistence ecto.migrate

      - name: Run tests with coverage
        timeout-minutes: 45
        run: |
          mix test.coverdata
          mix coveralls --umbrella --import-cover cover

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve image version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*@version "\([^"]*\)".*/\1/p' mix.exs | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read @version from mix.exs"
            exit 1
          fi
          echo "Using mix.exs @version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build -f docker/Dockerfile \
            --label org.opencontainers.image.title=daemon_engine \
            --label org.opencontainers.image.description="ThomasTheDaemonEngine BPMN 2.0 workflow engine" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t engine:ci \
            .

      - name: Start Postgres
        run: |
          docker network create ci-net

          # Production pools are 100 write + 50 read; stock Postgres allows 100.
          docker run -d \
            --name postgres \
            --network ci-net \
            -e POSTGRES_USER=evil_engine \
            -e POSTGRES_PASSWORD=evil_engine \
            -e POSTGRES_DB=evil_engine_ci \
            postgres:16-alpine \
            postgres -c max_connections=200

          ready=0
          for i in $(seq 1 15); do
            if docker exec postgres pg_isready -U evil_engine > /dev/null 2>&1; then
              echo "Postgres ready"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "Postgres never became ready"
            docker logs postgres
            exit 1
          fi

      - name: Start application container
        run: |
          docker run -d \
            --name engine \
            --network ci-net \
            -p 4000:4000 \
            -e TDE_DATABASE_HOST=postgres \
            -e TDE_DATABASE_PORT=5432 \
            -e TDE_DATABASE_NAME=evil_engine_ci \
            -e TDE_DATABASE_USER=evil_engine \
            -e TDE_DATABASE_PASS=evil_engine \
            -e TDE_HTTP_PORT=4000 \
            -e TDE_HTTP_SECRET_KEY_BASE=ci-only-secret-key-base-must-be-at-least-64-characters-long-for-phoenix \
            -e TDE_AUTH_DISABLED=true \
            -e TDE_ENGINE_ID=evil-engine-ci \
            -e TDE_ENGINE_NAME="Daemon Engine (CI)" \
            engine:ci

      - name: Verify health endpoint
        run: |
          # GET /health is 204 No Content (empty body). Do not grep JSON.
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:4000/health || true)
            if [ "$code" = "204" ]; then
              echo "Health check passed (HTTP 204)"
              echo "Docker smoke test passed"
              exit 0
            fi
            echo "Waiting... ($i/30) HTTP ${code:-curl-failed}"
            sleep 2
          done

          echo "Docker smoke test FAILED — expected HTTP 204 from GET /health"
          echo "=== container logs ==="
          docker logs engine
          exit 1

      - name: Stash smoke-tested image
        if: github.ref == 'refs/heads/main'
        run: docker save engine:ci | gzip > /tmp/engine-ci.tar.gz

      - name: Upload image artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: engine-ci-image
          path: /tmp/engine-ci.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Tear down
        if: always()
        run: |
          docker rm -f engine postgres 2>/dev/null || true
          docker network rm ci-net 2>/dev/null || true

  docker-publish:
    name: Publish Docker image
    needs: [build_and_test, docker]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    # if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: daemon_engine

    steps:
      - name: Download smoke-tested image
        uses: actions/download-artifact@v4
        with:
          name: engine-ci-image
          path: /tmp

      - name: Load image
        run: gzip -dc /tmp/engine-ci.tar.gz | docker load

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        id: push
        env:
          VERSION: ${{ needs.docker.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${OWNER,,}/${IMAGE_NAME}:${VERSION}"
          docker tag engine:ci "$IMAGE"
          docker push "$IMAGE"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Confirm package is private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ env.IMAGE_NAME }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # First GHCR publish is private by default. Fail the job if this
          # package was later flipped to public (that change is irreversible).
          # Use /users/{owner}/… — GITHUB_TOKEN is not a user PAT, so /user/… 401s.
          VISIBILITY=""
          for i in $(seq 1 8); do
            if VISIBILITY="$(gh api "users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}" --jq .visibility 2>/dev/null)"; then
              break
            fi
            echo "Package not visible yet (attempt $i/8); waiting..."
            sleep 5
          done
          echo "GHCR package visibility: ${VISIBILITY:-unknown}"
          if [ "$VISIBILITY" != "private" ]; then
            echo "::error::Expected private GHCR package, got '${VISIBILITY:-unknown}'"
            exit 1
          fi

      - name: Summary
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "### Published Docker image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`$IMAGE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Visibility | private |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Digest | \`$DIGEST\` |" >> "$GITHUB_STEP_SUMMARY"
