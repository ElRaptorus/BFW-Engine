name: 'C77: PI retry with incompatible version migration rejected (422)'
fixture: retry_user_task.bpmn
process_model_id: RetryUserTask
tier: interactive
description: 'Start a PI with a user task (waits for input). Abort the PI. Deploy an

  incompatible v2 (different flow node IDs). Attempt retry with

  version="2.0.0". Expect 422 version_migration_incompatible.

  '
start:
  payload: null
steps:
- await_waiting:
    type: user_task
- abort:
    reason: version_reject_test
- await_completion:
    timeout: 5000
- assert_state:
    state: aborted
- deploy_variant:
    fixture: retry_user_task.bpmn
    version: 2.0.0
    replace:
      UserTask_1: UserTask_2
- retry:
    version: 2.0.0
    expect_error: version_migration_incompatible
    expect_conflicts: true
