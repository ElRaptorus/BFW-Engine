name: 'C65: Call Activity implicit retry — child aborted, retry parent, child resumes'
wait_timeout_ms: 15000
fixture: retry_parent_with_user_task_child.bpmn
child_fixtures:
- retry_user_task.bpmn
process_model_id: RetryParentWithUserTaskChild
tier: interactive
start:
  payload: null
steps:
- child:
    of: main
    as: child_before
- await_waiting:
    type: user_task
    pi: child_before
    timeout: 15000
- abort:
    reason: cascade_abort
- await_completion:
    timeout: 5000
- assert_state:
    state: aborted
- retry: null
- pause: 5000
- child:
    of: main
    as: child_after
    index: last
- await_waiting:
    type: user_task
    pi: child_after
    as: child_task
    timeout: 15000
- finish_user_task:
    pi: child_after
    fni: child_task
    values:
      done: true
- await_completion:
    pi: child_after
    timeout: 15000
expected:
  final_state: finished
