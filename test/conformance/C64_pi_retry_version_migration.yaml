name: 'C64: PI retry with compatible version migration'
fixture: retry_user_task.bpmn
process_model_id: RetryUserTask
tier: interactive
start:
  payload: null
steps:
- await_waiting:
    type: user_task
- remember_process_version:
    as: before
- abort:
    reason: version_migrate
- await_completion:
    timeout: 5000
- deploy_variant:
    fixture: retry_user_task.bpmn
    version: 2.0.0
- retry:
    version: 2.0.0
- assert_process_version_changed:
    since: before
- await_waiting:
    type: user_task
    as: retried
    timeout: 10000
- finish_user_task:
    fni: retried
    values:
      done: true
expected:
  final_state: finished
