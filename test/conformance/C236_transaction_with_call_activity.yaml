name: "C236: Transaction with Call Activity — cancel interrupts CA child PI"
fixture: "transaction_with_call_activity.bpmn"
process_model_id: "transaction_with_call_activity"
child_fixtures:
  - "transaction_with_call_activity_child.bpmn"
tier: auto
notes: >
  Transaction contains a Call Activity that starts a long-running child process,
  then a Cancel End Event fires concurrently. The Cancel End interrupts the Call
  Activity, causing its child PI to be aborted. The child transaction PI goes
  :cancelled. Cancel Boundary on the shell fires, parent finishes at End_Cancelled.
start:
  payload: null
expected:
  final_state: "finished"
  final_tokens:
    - endEventId: "End_Cancelled"
